    src: src.features.target_clienti_morosi
    certified: False
    type: PREP_METRICS
    primary_key: [COD_CONTO_NETA]
    join_key: [PK_CONTO_FATT]
    description: Custom table elaborated to make the target variable of the prediction model.
    materialization_period: Only the months prior to 15 months ago starting June 2022.
    snapshot_overwrite: False
    historicization: versioned
    target_column: FLG_CLI_MOROSO
    today_minus_n_months: "15"
    view_on_modellato_layer: True
