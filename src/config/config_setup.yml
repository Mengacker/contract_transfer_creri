# ---------------------------------------------------------------------------- #
#                                  MODELING:                                   #
#       models, functions UDF, volumes, queries and materialized queries       #
# ---------------------------------------------------------------------------- #

modeling:
  model_deterministic:
    name: creri_model_deterministic
    description: Deterministic model, i.e. a deterministic logic that check if a POD/PDR is present in a yellow-list of POD/PDR with unpaid credits arrears. It is deployed only on-demand if the roll-back is required.

  model_scoring:
    name: creri_model_scoring
    description: Binary classification model of the customer with unpaid credit arrears. It is the model trained with the machine learning process.

  model_serving:
    name: creri_model_serving
    description: Serving model for the three-category classification of customers at risk of fraudulent default. This is the model that post-processes the prediction of the scoring model contained within it.


# ---------------------------------------------------------------------------- #
#                                   SERVING:                                   #
#                   endpoints, on-line tables, functions UDF                   #
# ---------------------------------------------------------------------------- #

serving_endpoint:
  # ep_scoring:
  #   name: antifrode_volture
  #   src: ["antifrode-volture-model-scoring","antifrode-volture-model-deterministic"]
  #   description: attualmente in produzione MA CHE PER CAMBIARLO A FRONT-END VA RICHIESTA UNA CHANGE!
  ep_scoring:
    name_for_test: creri_sep_infer_realtime # non è stato possibile aggiornare l'URL con il nome del nuovo Databricks endpoint nella function app di API Capabilities, si userà quindi tale nome solo per gli endpoint di test in ambiente P1
    name: antifrode_volture # quindi si è tornato al vecchio nome che era in produzione in ambiente P1 in fase di dev
    src: [creri_model_serving,creri_model_deterministic]
    description: The endpoint that puts the model into service.


  ep_mstr_volturante:
    name: creri_sep_mstr_volturante
    src: [creri_udf_infer_mstr_volturante]
    description: The endpoint that serves the UDF that allows to query the online inference table of incoming customer.
    primary_key: COD_FISCALE_PIVA_CLIIN

  ep_mstr_volturato:
    name: creri_sep_mstr_volturato
    src: [creri_udf_infer_mstr_volturato]
    description: The endpoint that serves the UDF that allows to query the online inference table of outgoing customer.
    primary_key: POD_PDR

  udf_spec_volturante:
    name: creri_udf_infer_mstr_volturante
    src: creri_infer_mstr_volturante
    description: The User-Defined Function (UDF) that allows to query the online inference table of incoming customer.
    primary_key: COD_FISCALE_PIVA_CLIIN

  udf_spec_volturato:
    name: creri_udf_infer_mstr_volturato
    src: creri_infer_mstr_volturato
    description: The User-Defined Function (UDF) that allows to query the online inference table of outgoing customer.
    primary_key: POD_PDR


  oltab_volturante:
    # name: creri_oltab_infer_mstr_volturante # OLD correct name
    name: creri_udf_oltab_infer_mstr_volturante # NEW used name in P3
    name_for_test: oltab_creri_udf_infer_mstr_volturante # TEST name used in P1
    src: creri_infer_mstr_volturante
    description: The "creri_infer_mstr_volturante" delta table replicated in the on-line table format.
    primary_key: COD_FISCALE_PIVA_CLIIN

  oltab_volturato:
    # name: creri_oltab_infer_mstr_volturato # OLD correct name
    name: creri_udf_oltab_infer_mstr_volturato # NEW used name in P3
    name_for_test: oltab_creri_udf_infer_mstr_volturato # TEST name used in P1
    src: creri_infer_mstr_volturato
    description: The "creri_infer_mstr_volturato" delta table replicated in the on-line table format.
    primary_key: POD_PDR

  feature_store:
    name: mlops-creri-online-store
    description: The Lakebase Postgres project created to use the feature store framework. So, it allows to create the sync tables, i.e. the on-line tables.
    src: https://adb-5973735350228664.4.azuredatabricks.net/lakebase/projects/971ba4a0-790e-4320-bb0b-71ffb27b521f?database=creri


