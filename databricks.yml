# ----------------------------------------------------------------------------#
#                         ASSET BUNDLES CONFIGURATIONS                        #
# ----------------------------------------------------------------------------#

# The name of the bundle. run `databricks bundle schema` to see the full bundle settings schema.
bundle:
  name: creri # Contract Transfer Credit Risk

# Assets folder containing ML artifact-assets and workflows-assets for the ml project.
include:
  - ./src/assets/*.yml

# sync:
#   include:
#     - ../
#     - ../docs
#   exclude :
#     - ../.azure
    # - ../docs/
    # - ../src/*.yml
    # - ../src/*.py
    # - ../src/*.ipynb
    # - ../src/*.txt
    # - ../src/*.ini
#     #- ../notebooks/
# Permission and grants used for models and experiments
#grants: &grants
#  grants:
#    - privileges:
#        - EXECUTE
#      principal: account users

# Custom variables which can be called elsewhere in the yamls
variables:

  snapshot_date:
    description: Data snapshot da usare per la run.
    default: "{{job.trigger.time.[iso_date]}}"

  experiment_path:
    description: Experiment's name of the product.
    default: "/${bundle.target}_${bundle.name}_exp"

  model_name:
    description: The name of the model, i.e. the name of the product.
    default: ${bundle.name}_model

  init_script_path:
    description: Path to the init script.
    default: "/Workspace/.../files/init_script/extra_index_url.sh"

  sp_user:
    description: Service principle used to access the workspace.
    default: sp
  run_as_sp:
    description: Service principal for running workflows
    default: sp

  run_setup_sp:
    description: Service principal for running setup script
    default: sp

  pypi_token:
    description: Scope for the pypi token
    default: "{{secrets/mlops/pypitoken}}"

  my_permissions:
    description: Permissions configurations
    type: complex
    default:
      - level: CAN_MANAGE
        group_name: user

  my_email_notifications:
    description: Settings for email notifications
    type: complex
    default:
      on_failure:
      on_success:

  my_email_notifications_daily:
    description: Settings for email notifications
    type: complex
    default:
      on_failure:

  cod_env:
    description: "Codice ambiente"
    default: D1_t

  product:
    description: "Prodotto"
    default: mlops_product_test

  build_id:
    description: "Id of the current build"
    default: 2


  ai_logging_cluster:
        description: Cluster to use for training master creation and data preparation.
        type: complex
        default:
          num_workers: 1
          spark_version: 15.4.x-scala2.12
          node_type_id: Standard_D4ds_v5
          driver_node_type_id: Standard_D4ds_v5
          autoscale:
            min_workers: 1
            max_workers: 1
          data_security_mode: USER_ISOLATION
          spark_env_vars:
            PYPI_TOKEN: ${var.pypi_token}
          spark_conf:
            spark.databricks.delta.preview.enabled: true
            spark.databricks.delta.optimizeWrite.enabled: true
            spark.databricks.delta.autoCompact.enabled: true
            spark.driver.extraJavaOptions: "-Dio.netty.tryReflectionSetAccessible=true"
            spark.databricks.io.cache.compression.enabled: false
            spark.databricks.io.cache.enabled: true
          custom_tags:
            FinOpsShowback: ${var.fs_tag}
            clusterSource: mlops-stack/0.2

  ai_standard_cluster:
        description: Cluster to use for training master creation and data preparation.
        type: complex
        default:
          num_workers: 2
          spark_version: 15.4.x-scala2.12
          node_type_id: Standard_D16ds_v5
          driver_node_type_id: Standard_D16ds_v5
          autoscale:
            min_workers: 1
            max_workers: 4
          data_security_mode: USER_ISOLATION
          spark_env_vars:
            PYPI_TOKEN: ${var.pypi_token}
          spark_conf:
            spark.databricks.delta.preview.enabled: true
            spark.databricks.delta.optimizeWrite.enabled: true
            spark.databricks.delta.autoCompact.enabled: true
            spark.driver.extraJavaOptions: "-Dio.netty.tryReflectionSetAccessible=true"
            spark.databricks.io.cache.compression.enabled: false
            spark.databricks.io.cache.enabled: true
          custom_tags:
            FinOpsShowback: ${var.fs_tag}
            clusterSource: mlops-stack/0.2

  ai_1_cluster:
    description: Cluster to use for training master creation and data preparation.
    type: complex
    default:
      num_workers: 2
      spark_version: 15.4.x-scala2.12
      node_type_id: Standard_D16ds_v5
      driver_node_type_id: Standard_D16ds_v5
      autoscale:
        min_workers: 1
        max_workers: 4
      spark_env_vars:
        PYPI_TOKEN: ${var.pypi_token}
      spark_conf:
        spark.databricks.delta.preview.enabled: true
        spark.databricks.delta.optimizeWrite.enabled: true
        spark.databricks.delta.autoCompact.enabled: true
        spark.driver.extraJavaOptions: "-Dio.netty.tryReflectionSetAccessible=true"
        spark.databricks.io.cache.compression.enabled: false
        spark.databricks.io.cache.enabled: true
      custom_tags:
        FinOpsShowback: ${var.fs_tag}
        clusterSource: mlops-stack/0.2

  ai_2_cluster:
      description: Cluster to use for tuning and ray, no autoscaling. Driver and executors bigger.
      type: complex
      default:
        num_workers: 2
        spark_version: 16.4.x-scala2.12
        node_type_id: Standard_DS3_v2
        driver_node_type_id: Standard_D3_v2
        autoscale:
          min_workers: 1
          max_workers: 4
        data_security_mode: USER_ISOLATION
        spark_env_vars:
          PYPI_TOKEN: ${var.pypi_token}
        spark_conf:
          spark.databricks.delta.preview.enabled: true
          spark.databricks.delta.optimizeWrite.enabled: true
          spark.databricks.delta.autoCompact.enabled: true
          spark.driver.extraJavaOptions: "-Dio.netty.tryReflectionSetAccessible=true"
          spark.databricks.io.cache.compression.enabled: false
          spark.databricks.io.cache.enabled: true
        custom_tags:
          FinOpsShowback: ${var.fs_tag}
          clusterSource: mlops-stack/0.2


